<svg xmlns="http://www.w3.org/2000/svg" class="pdl" viewBox="0 0 329 262" width="165" height="131" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Loading</title>

  <defs>
    <linearGradient id="pdl-fade1" gradientUnits="userSpaceOnUse" x1="0.5" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#0366db" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0366db"/>
    </linearGradient>
    <linearGradient id="pdl-fade2" gradientUnits="userSpaceOnUse" x1="29.5" y1="0" x2="61.5" y2="0">
      <stop offset="0" stop-color="#0366db" stop-opacity=".46"/>
      <stop offset="1" stop-color="#0366db" stop-opacity=".92"/>
    </linearGradient>
  </defs>

  <style>
    /* ---- Tweak these ---- */
    .pdl { --pdl-dark:#0154bc; --pdl-light:#0366db; --pdl-dur:1.2s; --pdl-hop:5px; }

    .pdl-dark  { fill: var(--pdl-dark); }
    .pdl-light { fill: var(--pdl-light); }

    .pdl-part { transform-box: fill-box; }

    /* Speed lines: stretch out from the cart, hold, then streak away and fade */
    .pdl-line { transform-origin: 100% 50%; opacity: 0;
      animation: pdl-trail var(--pdl-dur) cubic-bezier(.3,0,.2,1) infinite; }
    #pdl-speed1 { animation-delay: calc(var(--pdl-dur) * -.10); }
    #pdl-speed2 { animation-delay: calc(var(--pdl-dur) * -.32); }

    /* Wheels: small hop with squash and stretch, slightly out of step */
    .pdl-wheel { transform-origin: 50% 100%;
      animation: pdl-hop var(--pdl-dur) ease-in-out infinite; }
    #pdl-wheel2 { animation-delay: calc(var(--pdl-dur) * .12); }

    @keyframes pdl-trail {
      0%   { transform: translateX(14px) scaleX(.15); opacity: 0; }
      25%  { transform: none; opacity: 1; }
      60%  { transform: none; opacity: 1; }
      100% { transform: translateX(-26px) scaleX(.6); opacity: 0; }
    }
    @keyframes pdl-hop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      18%      { transform: translateY(0) scale(1.08, .92); }
      45%      { transform: translateY(calc(var(--pdl-hop) * -1)) scale(.96, 1.04); }
      70%      { transform: translateY(0) scale(1.05, .95); }
      85%      { transform: translateY(0) scale(1, 1); }
    }

    /* Respect reduced motion: show a calm, static logo */
    @media (prefers-reduced-motion: reduce) {
      .pdl-line  { animation: none; opacity: 1; }
      .pdl-wheel { animation: none; }
    }
  </style>

  <!-- Static logo body -->
  <path class="pdl-dark" fill="#0154bc"
    d="M126,58.6 L77,57.1 C55,58.2 30,66 28.4,79 C28.4,81.2 28.9,82.6 30,83.6 L68,83.4 C73,83.4 77.6,83.8 79,87.4 L63.6,205.8 C64.6,207.6 68,208.4 96,208.2 C101.2,206.8 104.8,201.6 105.8,195.6 Z"/>
  <path class="pdl-dark" fill="#0154bc"
    d="M91.2,3.8 L165,1 C197,1 223.1,38 223.1,75 C223.1,114 197,150.5 157,154.4 L127,151.2 L133,124 C155,124.6 176.6,104 176,80 C176,58 158,40 137,39 L86,39.2 Z"/>
  <path class="pdl-light" fill="#0366db"
    d="M328.4,35.4 L277,37.6 L214,140 C204.5,155.3 190,169 164,169 L126,169 C121,176 120,196 120.9,208.6 L190,210.6 C219,210.6 245,184 259.4,157 Z"/>

  <!-- Animated: speed lines -->
  <g id="pdl-speed1" class="pdl-part pdl-line">
    <rect x="0.5" y="99" width="64" height="14" rx="7" fill="url(#pdl-fade1)"/>
  </g>
  <g id="pdl-speed2" class="pdl-part pdl-line">
    <rect x="29.5" y="127.4" width="32" height="12.8" rx="6.4" fill="url(#pdl-fade2)"/>
  </g>

  <!-- Animated: wheels -->
  <g id="pdl-wheel1" class="pdl-part pdl-wheel"><circle class="pdl-light" cx="106.4" cy="241.8" r="19.8" fill="#0366db"/></g>
  <g id="pdl-wheel2" class="pdl-part pdl-wheel"><circle class="pdl-light" cx="217.3" cy="241.8" r="19.8" fill="#0366db"/></g>
</svg>
