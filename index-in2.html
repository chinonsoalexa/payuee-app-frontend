<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spin & Win</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      position: relative; /* make pointers absolute inside */
      width: 350px;
    }

    #wheel {
      width: 350px;
      height: 350px;
      border-radius: 50%;
      border: 8px solid #333;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      display: block;
    }

    #spinBtn {
      margin-top: 50px;
      padding: 10px 25px;
      font-size: 18px;
      border: none;
      background: #ff9800;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #stopBtn {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 18px;
      border: none;
      background: #ff7300;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #pointer {
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-top: 45px solid red;
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #bottomPointer {
        width: 0;
        height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 45px solid red; /* points upward into wheel */
        position: absolute;
        bottom: -45px; /* pull it up closer */
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
    }

#winnerPopup {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(135deg, #ff5722, #ff9800);
  border-radius: 20px;
  padding: 25px 40px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  font-family: 'Arial Black', Arial, sans-serif;
}

#winnerContent {
  color: #fff;
  font-size: 20px;
  text-align: center;
  font-weight: bold;
}

#winnerPopup.show {
  animation: popup 0.8s ease forwards;
}

@keyframes popup {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

#confettiCanvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  width: 100%;
  height: 100%;
  z-index: 15;
}

#fingerGuide {
  position: absolute;
  bottom: 28px; /* slightly above STOP button */
  left: 50%;
  transform: translateX(-50%);
  text-align: right;
  font-size: 24px;
  font-weight: bold;
  pointer-events: none;
  animation: bounce 1s infinite;
  z-index: 20;
  color: #ff5722;
  display: none; /* hidden by default */
}

#fingerGuide span {
  display: block;
  font-size: 14px;
  font-weight: normal;
  color: #333;
  margin-top: 5px;
}

@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-10px); }
}

  </style>
</head>
<body>

<div class="container">
  <div id="pointer"></div>
  <canvas id="wheel" width="350" height="350"></canvas>
  <!-- <div id="bottomPointer"></div> -->
  
  <button id="spinBtn">SPIN</button>
  <button id="stopBtn">STOP</button>

  <div id="fingerGuide">
    <span>Click on "STOP"</span>
    👇
  </div>

  <div id="winnerPopup">
  <div id="winnerContent">
    <span id="winnerText">You won:</span>
    <span id="winnerPrize">100 Points</span>
  </div>
</div>

  <canvas id="confettiCanvas"></canvas>
</div>

<script>
  const wheelCanvas = document.getElementById("wheel");
  const ctx = wheelCanvas.getContext("2d");

  const W = wheelCanvas.width;
  const H = wheelCanvas.height;
  const CX = W/2;
  const CY = H/2;
  const R = 170;

    // Higher weight = higher chance to appear
    const gifts = [
        { name: "50 Points 🎯", weight: 30 },
        { name: "1GB Data 📶", weight: 20 },
        { name: "100 Points 🎉", weight: 15 },
        { name: "500MB Data 📡", weight: 20 },
        { name: "200 Points 💰", weight: 10 },
        { name: "1 Free Spin 🔄", weight: 5 }
    ];

  const arc = (2 * Math.PI) / gifts.length;

  function drawWheel() {
    ctx.clearRect(0,0,W,H);

    // Draw wheel slices
    for (let i = 0; i < gifts.length; i++) {
      ctx.beginPath();
      ctx.fillStyle = i % 2 === 0 ? "#ffeb3b" : "#ffc107";
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, i * arc, (i + 1) * arc);
      ctx.lineTo(CX, CY);
      ctx.fill();

      // Labels
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(i * arc + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#000";
      ctx.font = "16px Arial";
      ctx.fillText(gifts[i].name, R - 20, 10);
      ctx.restore();
    }

    // Draw boundary dots LAST so they don't overwrite
    for (let i = 0; i < gifts.length; i++) {
      const a = i * arc;
      const dotX = CX + Math.cos(a) * (R - 10);
      const dotY = CY + Math.sin(a) * (R - 10);

      ctx.beginPath();
      ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#000"; // black dots
      ctx.fill();
    }
  }

  function highlightSlice(index) {
    ctx.save();
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, index * arc, (index + 1) * arc);
    ctx.lineTo(CX, CY);
    ctx.fill();
    ctx.restore();
  }

  drawWheel();

  let spinning = false;
  let spinInterval;
  let angle = 0; // degrees

  // helper: set wheel rotation
  function setRotation(deg) {
    wheelCanvas.style.transform = `rotate(${deg}deg)`;
  }

    function pickWeightedGift() {
        const totalWeight = gifts.reduce((sum, g) => sum + g.weight, 0);
        let random = Math.random() * totalWeight;

        for (let i = 0; i < gifts.length; i++) {
            if (random < gifts[i].weight) return i;
            random -= gifts[i].weight;
        }
        return gifts.length - 1; // fallback
    }

    const fingerGuide = document.getElementById("fingerGuide");

    document.getElementById("spinBtn").onclick = function () {
        if (spinning) return;

        drawWheel();  // <-- RESET highlight before a new spin

        const spinBtn = document.getElementById("spinBtn");
        spinBtn.disabled = true;
        spinBtn.style.cursor = "not-allowed";

        spinning = true;

        // Show finger guide after 2 seconds
        setTimeout(() => {
            fingerGuide.style.display = "block";
        }, 700); // 1000ms = 1 second

        spinInterval = setInterval(() => {
        angle += 12; // fast spin
        setRotation(angle);
        }, 16);
    };

document.getElementById("stopBtn").onclick = function () {
    if (!spinning) return;

    clearInterval(spinInterval);
    spinning = false;

    const winningIndex = pickWeightedGift(); // weighted prize

    let speed = 25;
    const friction = 0.995;
    const minSpeed = 0.05;
    let lastTickSector = -1;
    const sectorAngle = 360 / gifts.length;
    const pointerDeg = 270;

    fingerGuide.style.display = "none";

    const slowInterval = setInterval(() => {
        // Natural deceleration
        speed *= friction;
        angle += speed;
        setRotation(angle);

        // Tick effect for each sector
        const raw = (pointerDeg - (angle % 360) + 360) % 360;
        const currentSector = Math.floor(raw / sectorAngle);
        if (currentSector !== lastTickSector) {
            lastTickSector = currentSector;
        }

        // When wheel is slow, switch to final gentle nudge
        if (speed < 0.2) {
            const targetAngle = (360 - (winningIndex * sectorAngle + sectorAngle / 2) + pointerDeg) % 360
                    + Math.floor(angle / 360) * 360;

            let delta = targetAngle - angle;

            // Set a maximum final nudge speed smaller than current speed
            const finalStep = Math.min(0.15, Math.abs(delta)) * Math.sign(delta);
            angle += finalStep;
            setRotation(angle);

            // Stop when very close
            if (Math.abs(delta) < 0.05) {
                clearInterval(slowInterval);
                angle = targetAngle;
                setRotation(angle);

                drawWheel();
                highlightSlice(winningIndex);
                showWinnerPopup(gifts[winningIndex].name);
                launchConfetti();

                const spinBtn = document.getElementById("spinBtn");
                spinBtn.disabled = false;
                spinBtn.style.cursor = "pointer";
            }
        }

    }, 16); // ~60fps
};

function showCelebration(text) {
  const resultEl = document.getElementById("result");
  resultEl.innerText = "🎉 " + text + " 🎉";
  
  // Animate popup
  resultEl.classList.remove("show");
  void resultEl.offsetWidth; // force reflow
  resultEl.classList.add("show");
  
  // Confetti
  launchConfetti();

  // hide after 4s
  setTimeout(() => {
    resultEl.classList.remove("show");
  }, 4000);
}

// Simple confetti effect
function launchConfetti() {
  const canvas = document.getElementById("confettiCanvas");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const confettis = [];

  // generate confetti pieces
  for (let i = 0; i < 150; i++) {
    confettis.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      r: Math.random() * 6 + 4,
      d: Math.random() * 20 + 10,
      color: `hsl(${Math.random() * 360}, 100%, 50%)`,
      tilt: Math.random() * 10 - 10,
      tiltAngleIncrement: Math.random() * 0.07 + 0.05,
      tiltAngle: 0
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < confettis.length; i++) {
      const c = confettis[i];
      ctx.beginPath();
      ctx.lineWidth = c.r;
      ctx.strokeStyle = c.color;
      ctx.moveTo(c.x + c.tilt + c.r / 2, c.y);
      ctx.lineTo(c.x + c.tilt, c.y + c.tilt + c.r / 2);
      ctx.stroke();
    }
    update();
  }

  function update() {
    for (let i = 0; i < confettis.length; i++) {
      const c = confettis[i];
      c.tiltAngle += c.tiltAngleIncrement;
      c.y += (Math.cos(c.d) + 3 + c.r / 2) / 2;
      c.tilt = Math.sin(c.tiltAngle) * 15;
      if (c.y > canvas.height) {
        c.y = -10;
        c.x = Math.random() * canvas.width;
      }
    }
  }

  let animFrame;
  function animate() {
    draw();
    animFrame = requestAnimationFrame(animate);
  }

  animate();

  // stop after 4s
  setTimeout(() => {
    cancelAnimationFrame(animFrame);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }, 4000);
}

function showWinnerPopup(prize) {
  const popup = document.getElementById("winnerPopup");
  const prizeEl = document.getElementById("winnerPrize");
  
  prizeEl.innerText = prize;
  popup.classList.remove("show");
  
  // force reflow to replay animation
  void popup.offsetWidth;
  
  popup.classList.add("show");

  // hide after 4 seconds
  setTimeout(() => {
    popup.classList.remove("show");
  }, 6000);
}

</script>

</body>
</html>
